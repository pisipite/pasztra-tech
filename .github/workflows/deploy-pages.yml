name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: GoSungrow gyorsítótár
        uses: actions/cache@v4
        with:
          path: ~/gosungrow
          key: gosungrow-encryption-v3.0.7-linux-amd64
      - name: Govee mérési előzmények
        uses: actions/cache@v4
        with:
          path: .data-history
          key: govee-history-${{ github.run_id }}
          restore-keys: |
            govee-history-
      - name: Friss Sungrow és Govee adatok
        env:
          TZ: Europe/Budapest
          SUNGROW_USER: ${{ secrets.SUNGROW_USER }}
          SUNGROW_PASSWORD: ${{ secrets.SUNGROW_PASSWORD }}
          SUNGROW_PS_ID: ${{ vars.SUNGROW_PS_ID }}
          SUNGROW_HOST: ${{ vars.SUNGROW_HOST }}
          SUNGROW_APPKEY: ${{ vars.SUNGROW_APPKEY }}
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          GOVEE_DEVICE_ID: ${{ vars.GOVEE_DEVICE_ID }}
          GOVEE_DEVICE_SKU: ${{ vars.GOVEE_DEVICE_SKU }}
          GOVEE_ROOM_NAME: ${{ vars.GOVEE_ROOM_NAME }}
          CLIMATE_HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/govee-history.json
          CO2_KG_PER_KWH: ${{ vars.CO2_KG_PER_KWH }}
        run: bash scripts/fetch-live-data.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
