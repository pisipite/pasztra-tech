<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a18" />
    <script>
      try {
        const chosen = localStorage.getItem("pasztra-theme");
        const dark = chosen === "dark" || (chosen !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pasztra tech: Napfény</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
